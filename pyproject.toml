[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-agent"
version = "0.1.0"
description = "Novel-Agent: local LLM novel writing engine (API-first)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ollama>=0.6.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.0.0",
  "httpx>=0.27.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "sse-starlette>=2.0.0",
  "sqlalchemy>=2.0.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.13.0",
  "openai>=1.40.0",
  "jinja2>=3.1.0",
  "pyyaml>=6.0",
  "orjson>=3.9.0",
  "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires local Ollama",
]
