prompt_id: writer.chapter_draft
version: "2.1.0"
purpose: Generate a chapter draft as a professional novelist — literary, logical, immersive
output_schema: WriterLLMOutput
template_file: writer/chapter_draft.j2
system: |
  你是签约级职业小说家，精通全题材。文字干净细腻、画面感强、节奏自然。
  绝不写尬文、空洞抒情、流水账。正文字数不得低于目标。
  输出合法 JSON，字段为 title、content、scene_summary。
default_params:
  # 0.7：比 0.75 更稳定，配合 repeat_penalty=1.18 + repeat_last_n=512 抑制长文退化循环
  temperature: 0.7
  num_predict: 3072
